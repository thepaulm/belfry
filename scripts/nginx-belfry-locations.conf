# Shared location blocks — installed at /etc/nginx/snippets/belfry-locations.conf
# and included by BOTH server blocks in nginx-belfry.conf (:80 LAN and
# 127.0.0.1:8081 tunnel).
#
# Kept in one file on purpose: the two ingress ports must route identically,
# and duplicating ~50 lines of proxy config is how one of them silently stops
# matching the other after a fix lands in only one place. The ONLY difference
# between the two ingresses belongs in the server blocks themselves — the
# tunnel one adds `auth_request`, the LAN one doesn't.

# NOTE: every location sets X-Belfry-Origin itself from the $belfry_origin map
# rather than inheriting a server-level directive. nginx only inherits
# proxy_set_header from an outer level when the inner level declares NONE of
# its own — and each of these declares several, so a server-level marker would
# be silently dropped and the gate would see every request as local.

# MediaMTX HLS — proxied so it's same-origin with the viewer.
location /hls/ {
    proxy_pass http://127.0.0.1:8888/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 30s;
    # MediaMTX issues 302s with bare-path Location headers (e.g.
    # "/cam5/index.m3u8?cookieCheck=1"). Rewrite them so the browser/app
    # stays inside /hls/ AND so the resulting absolute Location uses
    # $effective_scheme — preserving the original client's scheme through
    # Caddy's HTTPS-to-tunnel-HTTP hop.
    proxy_redirect ~^/(.*)$ $effective_scheme://$host/hls/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $effective_scheme;
    proxy_set_header X-Belfry-Origin $belfry_origin;
}

# MediaMTX playback API — kept in case anything still hits the bare
# /playback/list or /playback/get; the viewer routes through /api/playback/*.
location /playback/ {
    proxy_pass http://127.0.0.1:9996/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 30s;
    proxy_redirect ~^/(.*)$ $effective_scheme://$host/playback/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $effective_scheme;
    proxy_set_header X-Belfry-Origin $belfry_origin;
}

# These two are how a caller OBTAINS an identity, so they can't require one.
# Both authenticate for themselves: /auth/exchange verifies a Google ID token
# against Google's JWKS plus our client-ID and email allow-lists, and
# /auth/verify validates a server JWT — it is the forward_auth target Caddy
# calls to mint the very header the gate checks for. Gating either would
# deadlock the mobile app's sign-in.
location = /auth/exchange {
    auth_request off;
    proxy_pass http://127.0.0.1:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $effective_scheme;
    proxy_set_header X-Belfry-Origin $belfry_origin;
    proxy_read_timeout 60s;
}

location = /auth/verify {
    auth_request off;
    proxy_pass http://127.0.0.1:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $effective_scheme;
    proxy_set_header X-Belfry-Origin $belfry_origin;
}

# FastAPI — playback MP4 cache misses can take longer than the default 60s
# read timeout when the upstream is downloading from MediaMTX, so bump the
# timeout for /api/playback/get specifically.
location /api/playback/get {
    proxy_pass http://127.0.0.1:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $effective_scheme;
    proxy_set_header X-Belfry-Origin $belfry_origin;
    proxy_read_timeout 300s;
}

location / {
    proxy_pass http://127.0.0.1:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $effective_scheme;
    proxy_set_header X-Belfry-Origin $belfry_origin;
}
