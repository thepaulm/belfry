<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>belfry · playback</title>
  <link rel="stylesheet" href="/static/viewer.css?v=18">
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script defer src="/static/overlay.js?v=5"></script>
  <script defer src="/static/playback.js?v=24"></script>
</head>
<body class="playback-body">
  <header>
    <h1>belfry</h1>
    <nav id="set-nav">
      <a id="back-to-set" href="/">&larr; All cameras</a>
    </nav>
    <a class="nav-link" href="/events">Events</a>
    <button id="labels-toggle" class="labels-toggle" type="button" aria-pressed="false">Show labels</button>
    <span id="status" class="status-pill"></span>
  </header>
  <main id="playback">
    <div class="playback-video-wrap">
      <video id="player" controls playsinline></video>
    </div>
    <div class="playback-controls">
      <div class="control-row">
        <label for="day-picker">Day</label>
        <select id="day-picker"></select>
        <button id="go-live" type="button">● Go Live</button>
        <button id="prev-event" type="button" title="Previous event ([)">◀ event</button>
        <button id="next-event" type="button" title="Next event (])">event ▶</button>
        <span id="event-legend" class="muted"></span>
        <span id="window-label" class="muted"></span>
      </div>
      <div class="timeline">
        <div id="availability"></div>
        <div id="event-pips"></div>
        <div id="cursor"></div>
        <input type="range" id="scrubber" min="0" max="86399" step="1" value="0">
        <div class="ticks">
          <span>00:00</span>
          <span>06:00</span>
          <span>12:00</span>
          <span>18:00</span>
          <span>24:00</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
