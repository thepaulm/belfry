# Copy to cameras.yaml and fill in real RTSP URLs (with credentials).
# cameras.yaml is gitignored. Keep its mode 0600.
#
# Cameras are organised into named "sets". Each camera `name` is the
# MediaMTX path key and must be unique across ALL sets.
# The HLS URL for a camera is ${hls_base}/${name}/index.m3u8.

hls_base: /hls

# Local recording — phase 1.
# `path` is where MediaMTX writes mp4 segments and where the retention
# loop scans. Relative paths resolve from the project root.
recording:
  path: ./recordings

# Disk-aware retention for the recordings directory.
# Watermark hysteresis: when usage > evict_high_pct, delete oldest
# segments globally (across all cameras) until usage < evict_low_pct.
retention:
  evict_high_pct: 85
  evict_low_pct: 80
  scan_interval_s: 60

# Phase 4 inference defaults. Per-camera enable lives on each camera below
# (`inference: true`). Model files default under inference/; the install
# script downloads them. Per-class thresholds override the default for
# noisy classes (e.g. raise `person` to suppress door-blowing-in false
# positives, lower `bird` to catch partial-frame detections).
inference:
  conf_threshold: 0.40
  class_thresholds:
    # person: 0.45
    # bird:   0.30
  cooldown_s: 10            # gap that closes an event run
  record_fps: 1             # always-on recorder per cam
  live_fps: 5               # on-demand viewer overlay (slice 5)
  event_classes:
    - person
    - dog
    - cat
    - bird
    - car
    - truck
  # OpenCV MOG2 motion detector. Catches movement YOLO can't classify
  # (deer, raccoon, opossum, …). Default off globally; turn on per cam
  # below with `motion: true`. IoU-suppressed against YOLO so a walking
  # person doesn't double-fire as `person` and `motion`.
  motion:
    enabled: false
    history: 500            # frames of background history (~8 min at 1 fps)
    var_threshold: 25       # higher → less sensitive (16 fires on noise)
    min_blob_pct: 0.005     # ignore blobs <0.5% of the 640x360 proc frame
    min_persistence_frames: 2  # box must appear in N consecutive ticks
  # config_db_path: ./recordings/config.db  # ROIs / alert rules / device
  #                                          # tokens. Default shown; kept
  #                                          # out of events.db so rebuilding
  #                                          # derived data never wipes zones.

# ROI alerts → mobile push. Draw named polygonal regions per camera at
# /rois and add rules (class-in-region). The recorder fires an alert when
# a matching detection enters a region; alerts persist to events.db and
# serve over /api/alerts. Push to the mobile app uses Firebase Cloud
# Messaging — leave fcm_credentials_path unset and push is simply off
# (alerts still persist + serve); set it to a Firebase service-account
# JSON to enable. iOS also needs an APNs key uploaded to Firebase.
alerts:
  # fcm_credentials_path: /etc/belfry/fcm-service-account.json
  # fcm_project_id: ""        # optional; read from the JSON if omitted
  default_cooldown_s: 60       # min seconds between alerts for one rule

sets:
  - id: set1
    label: Set 1
    cameras:
      - name: cam6
        label: Backyard
        enabled: true
        inference: true     # opt-in per camera; default false
        # motion: true      # opt-in per camera; null falls back to inference.motion.enabled
        rtsp: rtsp://admin:CHANGEME@192.168.1.10:8554/Streaming/Channels/101

  - id: set2
    label: Set 2
    cameras: []
