# Orin nginx config — installed at /etc/nginx/sites-available/belfry.
#
# Auth model:
#   - LAN (you on home WiFi) hits this nginx directly. No auth — trusted.
#   - Public hits Caddy on EC2 first, which gates with Google OAuth via
#     oauth2-proxy and only then reverse-proxies through the SSH tunnel
#     into this nginx. No second auth layer here.

# When the request came in through Caddy on EC2, the X-Forwarded-Proto
# header is "https"; on a direct-LAN request it's absent and we fall
# back to $scheme (always "http" because nginx only listens on port 80).
#
# We need this because nginx, when rewriting upstream Location headers
# via proxy_redirect, makes the result absolute by prepending $scheme +
# $host. Using $scheme would always produce http:// even for requests
# that originated as https, and Android's NetworkSecurityConfig rejects
# the resulting cleartext Location at the device level before HLS can
# follow it.
map $http_x_forwarded_proto $effective_scheme {
    default $scheme;
    https https;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # MediaMTX HLS — proxied so it's same-origin with the viewer.
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
        # MediaMTX issues 302s with bare-path Location headers (e.g.
        # "/cam5/index.m3u8?cookieCheck=1"). Rewrite them so the
        # browser/app stays inside /hls/ AND so the resulting absolute
        # Location uses $effective_scheme — preserving the original
        # client's scheme through Caddy's HTTPS-to-tunnel-HTTP hop.
        proxy_redirect ~^/(.*)$ $effective_scheme://$host/hls/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_scheme;
    }

    # MediaMTX playback API — kept in case anything still hits the bare
    # /playback/list or /playback/get; the new viewer routes through
    # /api/playback/* instead.
    location /playback/ {
        proxy_pass http://127.0.0.1:9996/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_redirect ~^/(.*)$ $effective_scheme://$host/playback/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_scheme;
    }

    # FastAPI — playback MP4 cache misses can take longer than the default
    # 60s read timeout when the upstream is downloading from MediaMTX, so
    # bump the timeout for /api/playback/get specifically.
    location /api/playback/get {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_scheme;
    }
}
