# Orin nginx config — installed at /etc/nginx/sites-available/belfry.
# Pairs with scripts/nginx-belfry-locations.conf, installed at
# /etc/nginx/snippets/belfry-locations.conf.
#
# Auth model — the LISTENING PORT is the trust boundary:
#
#   :80              LAN (you on home WiFi). No auth — trusted by network
#                    position. Unchanged from the original design.
#   127.0.0.1:8081   Where the EC2 reverse SSH tunnel lands. Every request
#                    must carry an allow-listed identity that Caddy obtained
#                    from Google, checked by auth_request against FastAPI.
#
# Why the port and not the source address: the tunnel forwards into the Orin's
# own loopback, so a request off the internet and a local `curl 127.0.0.1`
# arrive from the same IP and cannot be told apart. Splitting the ports makes
# the distinction structural. The tunnel unit must therefore point at 8081
# (-R 127.0.0.1:8080:127.0.0.1:8081) — see scripts/belfry-tunnel.service.
#
# Why a second gate at all: until 2026-10-17 the public path was gated only by
# oauth2-proxy on EC2, whose allow-list had never actually been enforced
# (`email_domains = ["*"]` overrode the emails file). Any Google account was
# authorized for five months and this box had no opinion about it, because it
# trusted whatever came out of the tunnel. Now an EC2-side misconfiguration
# alone is not enough to expose the cameras.
#
# Why auth_request here rather than only in FastAPI: /hls/ proxies straight
# from nginx to MediaMTX and never touches the FastAPI process, so a
# Python-only check would leave live video open on the public path.

# When the request came in through Caddy on EC2, the X-Forwarded-Proto header
# is "https"; on a direct-LAN request it's absent and we fall back to $scheme
# (always "http" because nginx only listens on port 80).
#
# We need this because nginx, when rewriting upstream Location headers via
# proxy_redirect, makes the result absolute by prepending $scheme + $host.
# Using $scheme would always produce http:// even for requests that originated
# as https, and Android's NetworkSecurityConfig rejects the resulting cleartext
# Location at the device level before HLS can follow it.
map $http_x_forwarded_proto $effective_scheme {
    default $scheme;
    https https;
}

# Marks requests that arrived on the tunnel port. Empty on :80, and nginx
# omits a header whose value is the empty string, so LAN requests carry no
# marker at all and the gate treats them as local.
map $server_port $belfry_origin {
    default "";
    8081    "remote";
}

# --- LAN ingress: no auth, unchanged behaviour -------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/belfry-locations.conf;
}

# --- Tunnel ingress: every request must prove an allow-listed identity -
server {
    listen 127.0.0.1:8081;
    server_name _;

    # Server-level, so it covers every location in the snippet — including
    # the MediaMTX upstreams. Locations that must stay reachable without an
    # identity (/auth/exchange, /auth/verify) opt out with `auth_request off`
    # inside the snippet.
    auth_request /__belfry_remote_gate;

    location = /__belfry_remote_gate {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:9090/api/internal/remote-gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # The subrequest's own path is this endpoint, so pass the URI being
        # authorized separately — the gate needs it to honour EXEMPT_PATHS.
        proxy_set_header X-Original-URI $request_uri;

        # Only this server block has this location, so anything reaching it
        # arrived through the tunnel by construction. Set the marker here
        # rather than trusting a client-supplied one.
        proxy_set_header X-Belfry-Origin remote;

        # Identities Caddy attached after its own gate passed. Caddy strips
        # client-supplied copies at ingress (cloud/Caddyfile), so these are
        # either Caddy's or absent — and absent is denied.
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Email $http_x_auth_email;
    }

    # The real upstream requests get their marker from the $belfry_origin map
    # inside the snippet — see the note at the top of that file for why it
    # can't be set here.

    include /etc/nginx/snippets/belfry-locations.conf;
}
