# Copy to mediamtx/mediamtx.yml and edit. The real file is gitignored
# because each `source:` line contains the camera credentials.
#
# Keep this file in sync with cameras.yaml: every `enabled: true` camera
# must have a matching `paths:` entry whose key equals the camera name.
# (Phase 2 will introduce scripts/render-mediamtx.py to generate this
# automatically from cameras.yaml.)

logLevel: info
logDestinations: [stdout]

# Disable everything we don't use in v1.
rtsp: yes
rtmp: no
webrtc: no
srt: no
metrics: no

# Local RTSP server: lets the FastAPI box (and later inference / SRT push)
# tap any path via `rtsp://127.0.0.1:8554/<name>`. Cameras don't push to us.
rtspAddress: 127.0.0.1:8554

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsVariant: fmp4
hlsSegmentCount: 5
hlsSegmentDuration: 1s
# Keep an HLS muxer running for every published path even when no reader
# is connected. Without this, navigating between sets tears down the
# previous set's muxers, so coming back forces a cold start (cookie-check
# redirect + initial segment fill) that sometimes outruns hls.js retries.
hlsAlwaysRemux: yes

# Playback HTTP API (Phase 1C scrubback UI uses /get and /list).
# Loopback only — nginx fronts it at /playback/.
playback: yes
playbackAddress: 127.0.0.1:9996

# Internal API (path stats, used by tooling). Loopback only.
api: yes
apiAddress: 127.0.0.1:9997

# Each camera is a single always-on path. The source is pulled 24/7 so
# recording captures continuously; the HLS muxer remains on-demand inside
# MediaMTX (it only emits playlists when a viewer is watching). Multiple
# consumers (HLS viewer, future inference, future SRT forward) all tap
# the same path via rtsp://127.0.0.1:8554/<name> — exactly one upstream
# RTSP session per camera regardless of how many things are reading.
#
# Retention is handled by dvr/retention.py, not MediaMTX, so
# `recordDeleteAfter: 0`.
paths:
  cam6:
    source: rtsp://admin:CHANGEME@192.168.1.10:8554/Streaming/Channels/101
    rtspTransport: tcp
    sourceOnDemand: no
    record: yes
    recordPath: /home/youruser/code/belfry/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordSegmentDuration: 1h
    recordPartDuration: 1s
    recordDeleteAfter: 0s

  # Add more cameras here as they come online. Example:
  # cam5:
  #   source: rtsp://admin:PASS@192.168.1.11:554/Streaming/Channels/101
  #   rtspTransport: tcp
  #   sourceOnDemand: no
  #   record: yes
  #   recordPath: /home/youruser/code/belfry/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  #   recordFormat: fmp4
  #   recordSegmentDuration: 1h
  #   recordPartDuration: 1s
  #   recordDeleteAfter: 0
