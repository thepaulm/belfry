# Orin nginx config — installed at /etc/nginx/sites-available/homecam.
#
# Two access paths land here:
#   1. LAN browser → this nginx directly. $remote_addr is a LAN IP.
#   2. Public browser → Caddy (EC2) → oauth2-proxy → reverse SSH tunnel →
#      this nginx via 127.0.0.1. Caddy adds X-Auth-Request-Email.
#
# The map below promotes that header to X-Forwarded-Auth-Email *only* for
# loopback-sourced requests, blanking it for LAN traffic so a malicious LAN
# client can't spoof an authenticated identity.

map $remote_addr $forwarded_email {
    default "";
    "127.0.0.1" $http_x_auth_request_email;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # MediaMTX HLS — proxied so it's same-origin with the viewer.
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
        # MediaMTX issues 302s with bare-path Location headers (e.g.
        # "/cam5/index.m3u8?cookieCheck=1"). Rewrite them so the browser
        # stays inside /hls/.
        proxy_redirect ~^/(.*)$ /hls/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MediaMTX playback API — kept in case anything still hits the bare
    # /playback/list or /playback/get; the new viewer routes through
    # /api/playback/* instead.
    location /playback/ {
        proxy_pass http://127.0.0.1:9996/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_redirect ~^/(.*)$ /playback/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI — playback MP4 cache misses can take longer than the default
    # 60s read timeout when the upstream is downloading from MediaMTX, so
    # bump the timeout for /api/playback/get specifically.
    location /api/playback/get {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Auth-Email $forwarded_email;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Auth-Email $forwarded_email;
    }
}
