<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>homecam · playback</title>
  <link rel="stylesheet" href="/static/viewer.css?v=12">
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script defer src="/static/playback.js?v=12"></script>
</head>
<body class="playback-body">
  <header>
    <h1>homecam</h1>
    <nav id="set-nav">
      <a id="back-to-set" href="/">&larr; live</a>
    </nav>
    <span id="status" class="status-pill"></span>
  </header>
  <main id="playback">
    <div class="playback-video-wrap">
      <video id="player" controls playsinline></video>
    </div>
    <div class="playback-controls">
      <div class="control-row">
        <label for="day-picker">Day</label>
        <select id="day-picker"></select>
        <span id="window-label" class="muted"></span>
      </div>
      <div class="timeline">
        <div id="availability"></div>
        <div id="cursor"></div>
        <input type="range" id="scrubber" min="0" max="86399" step="1" value="0">
        <div class="ticks">
          <span>00:00</span>
          <span>06:00</span>
          <span>12:00</span>
          <span>18:00</span>
          <span>24:00</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
