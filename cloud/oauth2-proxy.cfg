# oauth2-proxy — Google OAuth gate in front of Caddy.
#
# Secrets (client_id, client_secret, cookie_secret) come from
# /etc/oauth2-proxy/oauth2-proxy.env via the systemd EnvironmentFile.

provider = "google"
http_address = "127.0.0.1:4180"

# `static://200` makes oauth2-proxy a pure auth gate — Caddy does the actual
# upstream proxying via forward_auth, so oauth2-proxy doesn't need an
# upstream of its own.
upstreams = ["static://200"]

redirect_url = "https://example.com/oauth2/callback"
cookie_domains = ["example.com"]
whitelist_domains = ["example.com"]
cookie_secure = true
cookie_httponly = true
cookie_expire = "168h"  # 7 days

# Allow-list lives in a sibling file (one email per line) — this is the ONLY
# gate on who gets in.
#
# Do NOT add `email_domains = ["*"]` here. It reads like "don't filter by
# domain, let the file decide", but it is the opposite: in validator.go the
# `*` sets allowAll, and the final `if allowAll { valid = true }` runs AFTER
# the emails-file lookup and overwrites its result. The file is ignored and
# every Google account on earth is authorized. `--help` says it plainly:
# "Use * to authenticate any email". This shipped in the original commit and
# left the site open to any Google login until 2026-10-17; three accounts
# outside the allow-list reached live video before it was caught.
#
# Leaving email_domains unset is correct: the domain list is then empty, no
# domain matches, and authorization falls through to the emails file.
authenticated_emails_file = "/etc/oauth2-proxy/emails"

# Caddy is in front of us; honor X-Forwarded-* and skip the sign-in click-
# through page so the user goes straight to Google.
reverse_proxy = true
skip_provider_button = true

# Set X-Auth-Request-Email / -User on auth responses so Caddy can copy them
# onto the upstream request via `copy_headers` in the Caddyfile.
set_xauthrequest = true
pass_user_headers = true

silence_ping_logging = true
