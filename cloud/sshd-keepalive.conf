# Installed to /etc/ssh/sshd_config.d/10-belfry-keepalive.conf on the EC2
# frontdoor by install-ec2.sh.
#
# Why this exists: when the Orin reboots uncleanly, its TCP connection to EC2
# dies mid-flight. With no server-side keepalive (OpenSSH's default —
# ClientAliveInterval 0 is DISABLED), sshd never notices the peer is gone and
# keeps holding the reverse-tunnel listener on 127.0.0.1:8080. autossh on the
# Orin then retries forever against an orphaned port, failing with
#     Error: remote port forwarding failed for listen port 8080
# and exiting 255 each time because of ExitOnForwardFailure=yes. The public
# site stays down until the kernel's TCP timeout finally reaps the orphan.
# Observed 2026-08-09: 25 failed retries across ~2h (18:41 → 20:44 UTC), with
# the LAN site perfectly healthy the whole time.
#
# 30s × 3 missed probes ⇒ dead session reaped at ~90s, so the next autossh
# poll rebinds. Not set lower: the probes ride the encrypted channel, and 90s
# is already well inside autossh's retry cadence.
#
# The filename must sort BEFORE other drop-ins — sshd takes the FIRST value it
# sees for a keyword, not the last. Hence the 10- prefix.
#
# NOTE: this file is inert unless /etc/ssh/sshd_config contains
#   Include /etc/ssh/sshd_config.d/*.conf
# AL2023 ships that line by default. Verify with `sudo sshd -T | grep -i
# clientalive` after reloading; `sudo sshd -t` syntax-checks before you do.

ClientAliveInterval 30
ClientAliveCountMax 3
