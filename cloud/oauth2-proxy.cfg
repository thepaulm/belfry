# oauth2-proxy — Google OAuth gate in front of Caddy.
#
# Secrets (client_id, client_secret, cookie_secret) come from
# /etc/oauth2-proxy/oauth2-proxy.env via the systemd EnvironmentFile.

provider = "google"
http_address = "127.0.0.1:4180"

# `static://200` makes oauth2-proxy a pure auth gate — Caddy does the actual
# upstream proxying via forward_auth, so oauth2-proxy doesn't need an
# upstream of its own.
upstreams = ["static://200"]

redirect_url = "https://yellowchicken.io/oauth2/callback"
cookie_domains = ["yellowchicken.io"]
whitelist_domains = ["yellowchicken.io"]
cookie_secure = true
cookie_httponly = true
cookie_expire = "168h"  # 7 days

# Allow-list lives in a sibling file (one email per line). Combined with
# email_domains = ["*"] this means: any Google account in the file passes,
# nothing else does.
authenticated_emails_file = "/etc/oauth2-proxy/emails"
email_domains = ["*"]

# Caddy is in front of us; honor X-Forwarded-* and skip the sign-in click-
# through page so the user goes straight to Google.
reverse_proxy = true
skip_provider_button = true

# Set X-Auth-Request-Email / -User on auth responses so Caddy can copy them
# onto the upstream request via `copy_headers` in the Caddyfile.
set_xauthrequest = true
pass_user_headers = true

silence_ping_logging = true
