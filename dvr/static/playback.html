<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>belfry · playback</title>
  <link rel="stylesheet" href="/static/viewer.css?v=21">
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script defer src="/static/overlay.js?v=5"></script>
  <script defer src="/static/playback.js?v=28"></script>
</head>
<body class="playback-body">
  <header>
    <h1>belfry</h1>
    <nav id="set-nav">
      <a id="back-to-set" href="/">&larr; All cameras</a>
    </nav>
    <a id="back-to-alerts" class="nav-link" href="/alerts" hidden>&larr; Alerts</a>
    <a class="nav-link" href="/events">Events</a>
    <button id="labels-toggle" class="labels-toggle" type="button" aria-pressed="false">Show labels</button>
    <span id="status" class="status-pill"></span>
  </header>
  <main id="playback">
    <div class="playback-video-wrap">
      <video id="player" controls playsinline></video>
    </div>
    <div class="playback-controls">
      <div class="control-row">
        <label for="day-picker">Day</label>
        <select id="day-picker"></select>
        <button id="go-live" type="button">● Go Live</button>
        <button id="prev-event" type="button" title="Previous event ([)">◀ event</button>
        <button id="next-event" type="button" title="Next event (])">event ▶</button>
        <button id="capture-btn" type="button" title="Capture training image (C)">📷 Capture</button>
        <span id="event-legend" class="muted"></span>
        <span id="window-label" class="muted"></span>
      </div>
      <div class="control-row">
        <span class="muted">Scale</span>
        <div class="scale-group">
          <button id="scale-day" class="scale-btn active" type="button">Day</button>
          <button id="scale-hour" class="scale-btn" type="button">Hour</button>
          <button id="scale-5min" class="scale-btn" type="button">5 min</button>
        </div>
        <button id="prev-slice" type="button" title="Previous slice">◀</button>
        <button id="next-slice" type="button" title="Next slice">▶</button>
        <span id="slice-label" class="muted"></span>
      </div>
      <div class="timeline">
        <div id="availability"></div>
        <div id="event-pips"></div>
        <div id="cursor"></div>
        <input type="range" id="scrubber" min="0" max="86399" step="1" value="0">
        <div class="ticks">
          <span>00:00</span>
          <span>06:00</span>
          <span>12:00</span>
          <span>18:00</span>
          <span>24:00</span>
        </div>
      </div>
    </div>
  </main>

  <div id="capture-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h3>Capture training image</h3>
      <div class="capture-preview">
        <canvas id="capture-canvas"></canvas>
      </div>
      <div class="capture-form">
        <label class="capture-field">
          <span>Class</span>
          <input id="capture-class" type="text" list="capture-class-list"
                 autocomplete="off" spellcheck="false" placeholder="e.g. deer, person, raccoon">
        </label>
        <datalist id="capture-class-list">
          <option value="person"></option>
          <option value="dog"></option>
          <option value="cat"></option>
          <option value="bird"></option>
          <option value="car"></option>
          <option value="truck"></option>
          <option value="deer"></option>
          <option value="raccoon"></option>
          <option value="coyote"></option>
          <option value="fox"></option>
        </datalist>
        <label class="capture-field-inline">
          <input id="capture-negative" type="checkbox">
          <span>Negative example (this is NOT a …)</span>
        </label>
        <div class="capture-meta muted" id="capture-meta"></div>
        <div class="modal-buttons">
          <button id="capture-cancel" type="button">Cancel</button>
          <button id="capture-save" type="button" class="primary">Save</button>
        </div>
        <span id="capture-status" class="muted"></span>
      </div>
    </div>
  </div>
</body>
</html>
