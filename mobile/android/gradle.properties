org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Deliberately stay on the legacy Kotlin Gradle Plugin + old AGP DSL. Built-in
# Kotlin / the new DSL require AGP 9 (we're on AGP 8.7.3 / Gradle 8.12) and
# every Android plugin to ship a built-in-Kotlin build. Until we do that AGP 9
# migration, these two flags keep the supported legacy path AND stop Flutter's
# migrator from rewriting this file on every build. Flip to true (or remove)
# as part of the AGP 9 upgrade, not before.
android.builtInKotlin=false
android.newDsl=false
