[project]
name = "belfry"
version = "0.1.0"
description = "Self-hosted DVR + on-Jetson object detection over Hikvision-OEM IP cameras"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

# Inference deps live in their own extras group because they require a
# Jetson-built PyTorch wheel that doesn't resolve via PyPI on every
# platform. Install via scripts/install-inference.sh into a separate
# Python 3.10 venv (.venv-inference/) — the main DVR can stay on its
# uv-managed Python 3.14 .venv unaffected.
[project.optional-dependencies]
inference = [
    "ultralytics>=8.3",
    "numpy>=1.26",
    "opencv-python>=4.8",
    # The inference CLI imports dvr.config (which uses pyyaml) to share
    # the cameras.yaml loader. Re-listed here because the inference venv
    # is provisioned independently of the main project deps.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dvr", "inference"]
